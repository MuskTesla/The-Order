<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Order Revision 2</title>
<script src="kit.js"></script><script src="fluent.js"></script>
<style id="theme"></style>
<style>
.win { position:absolute; inset:0; display:flex; flex-direction:column; background:var(--mica); }
.tb { height:48px; display:flex; align-items:center; gap:10px; padding-left:12px; flex:none; position:relative; font-size:12px; }
.tb .appname { font-size:12px; }
.asb { position:absolute; left:50%; transform:translateX(-50%); width:clamp(200px, calc(100% - 640px), 420px); height:32px; border-radius:4px; background:var(--ctl); border:1px solid var(--ctlStroke); border-bottom-color:var(--ctlBottom); display:flex; align-items:center; gap:8px; padding:0 10px; color:var(--text3); font-size:14px; }
.asb.has { color:var(--text); }
.caps { margin-left:auto; display:flex; height:48px; } .caps span { width:46px; display:grid; place-items:center; color:var(--text2); }
.chip { display:flex; align-items:center; gap:8px; height:32px; padding:0 12px 0 4px; border-radius:16px; background:var(--subtle); font-size:12px; margin-left:auto; }
.chip .av { width:24px; height:24px; border-radius:12px; overflow:hidden; }
.mono { font-family:'Cascadia Mono',Consolas,monospace; font-variant-numeric:tabular-nums; }
.body { flex:1; display:flex; min-height:0; }
.pane { flex:none; display:flex; flex-direction:column; gap:2px; padding:4px 4px 8px; }
.nav { height:36px; display:flex; align-items:center; gap:12px; padding:0 12px; border-radius:4px; position:relative; color:var(--text); }
.nav.on { background:var(--subtle); } .nav.on::before { content:''; position:absolute; left:0; top:9px; bottom:9px; width:3px; border-radius:2px; background:var(--accent); }
.nav .badge { margin-left:auto; font-size:11px; line-height:16px; min-width:16px; text-align:center; padding:0 5px; border-radius:8px; background:var(--accent); color:var(--onAccent); }
.content { flex:1; background:var(--layer); border-top-left-radius:8px; border:1px solid var(--stroke); border-right:0; border-bottom:0; display:flex; flex-direction:column; min-width:0; position:relative; overflow:hidden; }
.head { display:flex; align-items:center; gap:6px; padding:20px 24px 12px 32px; flex:none; flex-wrap:wrap; }
.head .count { margin:10px 16px 0 10px; }
.chips { display:flex; gap:8px; align-items:center; padding:0 24px 12px 32px; flex:none; }
.fchip { height:28px; display:inline-flex; align-items:center; gap:6px; padding:0 4px 0 12px; border-radius:14px; background:var(--card); border:1px solid var(--stroke); font-size:13px; }
.grid { padding:4px 24px 24px 32px; display:grid; gap:12px; align-content:start; overflow:hidden; flex:1; }
.tile { background:var(--card); border:1px solid var(--stroke); border-radius:8px; padding:6px 6px 10px; position:relative; }
.tile .cv { aspect-ratio:3/4; border-radius:4px; overflow:hidden; }
.tile .tt { margin:8px 4px 0; font-weight:600; min-height:40px; }
.tile .mm { margin:2px 4px 0; display:flex; align-items:center; gap:8px; font-size:12px; line-height:16px; color:var(--text2); }
.tile.hover { background:var(--card2); box-shadow:var(--shadow); }
.tile.sel { border:2px solid var(--accent); padding:5px 5px 9px; }
.tile .cb { position:absolute; top:12px; right:12px; width:20px; height:20px; border-radius:4px; border:1px solid var(--ctlBottom); background:var(--ctl); display:grid; place-items:center; }
.tile .cb.on { background:var(--accent); border-color:var(--accent); color:var(--onAccent); }
.wish { position:absolute; left:12px; bottom:84px; font-size:11px; line-height:18px; padding:0 8px; border-radius:9px; background:rgba(0,0,0,.6); color:#fff; }
.cursor { position:absolute; width:22px; height:28px; z-index:5; filter:drop-shadow(0 1px 1px rgba(0,0,0,.4)); }
.selbar { display:flex; align-items:center; gap:6px; padding:16px 24px 12px 32px; flex:none; background:var(--layer); }
.menu { position:absolute; width:220px; padding:4px; border-radius:8px; background:var(--acrylic); backdrop-filter:blur(30px); border:1px solid var(--stroke); box-shadow:0 8px 32px rgba(0,0,0,.28); z-index:6; }
.menu div { height:36px; display:flex; align-items:center; gap:12px; padding:0 12px; border-radius:4px; }
.menu .hl { background:var(--subtle); }
/* list */
.lhead, .lrow { display:grid; align-items:center; column-gap:16px; padding:0 12px; }
.lhead { height:36px; font-size:12px; color:var(--text2); border-bottom:1px solid var(--divider); }
.lrow { height:56px; border-bottom:1px solid var(--divider); }
.lrow.hover { background:var(--subtle); border-radius:4px; }
.lrow .thumb { width:30px; height:40px; border-radius:2px; overflow:hidden; }
/* details */
.crumbs { display:flex; align-items:center; gap:8px; padding:14px 32px 0; flex:none; font-size:14px; }
.crumbs .a { color:var(--text2); }
.hero { position:relative; flex:none; overflow:hidden; }
.hero .amb { position:absolute; left:-8%; right:-8%; top:-60%; height:260%; filter:blur(26px) saturate(1.15); }
.hero .fade { position:absolute; inset:0; background:linear-gradient(180deg,rgba(0,0,0,.18),rgba(0,0,0,.18) 60%,var(--layer)); }
.poster { position:absolute; border-radius:8px; overflow:hidden; box-shadow:0 8px 24px rgba(0,0,0,.35); }
/* 完全清透 approximation: continuous clear glass, contrast-bounded tint, edge density, no inner card. */
.glass { position:absolute; border-radius:20px; overflow:hidden; }
.glass.clear-deep { backdrop-filter:brightness(.55) contrast(.9) saturate(1.05); background:rgba(32,32,32,.16); }
.glass.clear-lift { backdrop-filter:brightness(1.25) contrast(.78) saturate(1.05); background:rgba(250,250,250,.12); }
.glass.cont-deep { backdrop-filter:blur(12px) brightness(.55) contrast(.9); background:rgba(32,32,32,.22); }
.glass::after { content:''; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
 box-shadow:inset 0 1px 0 rgba(255,255,255,.42), inset 1px 0 0 rgba(255,255,255,.16), inset 0 -1px 0 rgba(0,0,0,.18), inset 0 0 22px rgba(255,255,255,.10); }
.glass .in { position:relative; z-index:2; padding:22px 26px; }
.onmedia { color:#fff; } .onmedia .caption { color:rgba(255,255,255,.82); }
.card { background:var(--card); border:1px solid var(--stroke); border-radius:8px; padding:16px 20px; }
.field label { display:block; font-size:14px; margin-bottom:6px; }
.input { height:32px; border-radius:4px; background:var(--ctl); border:1px solid var(--ctlStroke); border-bottom-color:var(--ctlBottom); padding:0 10px; display:flex; align-items:center; }
.input.dirty { border-bottom:2px solid var(--accent); }
.tog { width:40px; height:20px; border-radius:10px; background:var(--accent); position:relative; flex:none; } .tog::after { content:''; position:absolute; right:4px; top:4px; width:12px; height:12px; border-radius:6px; background:var(--onAccent); }
.tog.off { background:transparent; border:1px solid var(--text2); } .tog.off::after { left:4px; right:auto; top:3px; background:var(--text2); }
.savebar { position:absolute; left:32px; right:32px; bottom:16px; display:flex; align-items:center; gap:12px; padding:10px 12px 10px 16px; border-radius:8px; background:var(--acrylic); backdrop-filter:blur(30px); border:1px solid var(--stroke); box-shadow:var(--shadow); }
.link { color:var(--accentText); }
</style></head>
<body><div id="app"></div>
<script>
const P = params(); const GI = +(P.game || 0); const TH = P.theme || 'light', AC = P.accent || 'blue', VIEW = P.view || 'grid', W = innerWidth;
document.getElementById('theme').textContent = fluentCSS(TH, AC);
const EXP = W >= 1008, MIN = W < 641;
const CURSOR = `<svg viewBox="0 0 22 28"><path d="M2 2v20l5-5 4 9 4-2-4-9h7z" fill="#fff" stroke="#000" stroke-width="1.4"/></svg>`;

function shell(active, inner, o = {}) {
  const nav = (k, ic, label, extra = '') => `<div class="nav ${active === k ? 'on' : ''}" title="${label}">${icon(ic, 16)}${EXP ? `<span>${label}</span>${extra}` : ''}</div>`;
  const pane = MIN ? '' : `<nav class="pane" style="width:${EXP ? 240 : 48}px">${nav('library', 'library', '书架')}${nav('online', 'globe', '发现作品')}${nav('recog', 'scan', '识别与核对', '<span class="badge">3</span>')}
    <div style="flex:1"></div>${nav('settings', 'gear', '设置')}${nav('exit', 'power', '退出 The Order')}</nav>`;
  return `<div class="win"><div class="tb">${o.back ? `<span class="btn icon subtle" aria-label="返回">${icon('back', 14)}</span>` : ''}${MIN ? `<span class="btn icon subtle">${icon('list', 16)}</span>` : ''}
    ${BRAND}<span class="appname">The Order</span>
    ${MIN ? '' : `<div class="asb ${o.query ? 'has' : ''}">${icon('search', 14)}${o.query || '搜索书架'}</div>`}
    ${o.session !== false ? `<div class="chip" role="status">${W < 1100 ? '' : `<span class="av">${coverSVG(0)}</span><span class="ja">星海の約束</span>`}<span class="dot" style="background:var(--accent)"></span><span class="mono">0:42:10</span></div>` : ''}
    <div class="caps" style="margin-left:${o.session !== false ? 0 : 'auto'}"><span>—</span><span>☐</span><span>✕</span></div></div>
    <div class="body">${pane}<main class="content">${inner}</main></div></div>`;
}
function cols(avail, min) { return Math.max(2, Math.floor((avail + 12) / (min + 12))); }
function tile(g, i, s = {}) {
  return `<div class="tile ${s.hover ? 'hover' : ''} ${s.sel ? 'sel' : ''} ${s.focus ? 'focus' : ''}" role="button" aria-label="${esc(g.t)}">
   <div class="cv">${coverSVG(i)}</div>${s.selecting ? `<span class="cb ${s.sel ? 'on' : ''}">${s.sel ? icon('check', 14) : ''}</span>` : ''}
   ${g.inst === 0 ? '<span class="wish">愿望单</span>' : ''}
   <div class="tt clamp2 ${isJa(g.t) ? 'ja' : ''}">${esc(g.t)}</div>
   <div class="mm">${status2(g.s)}${g.r != null ? `<span>${g.r} 分</span>` : ''}${g.fav ? `<span style="margin-left:auto;color:var(--accentText)" aria-label="收藏">${icon('heart', 12)}</span>` : ''}</div>
   ${s.pointer ? `<div class="cursor" style="left:58%;top:46%">${CURSOR}</div>` : ''}</div>`;
}
function libHead(view, o = {}) {
  if (o.selecting) return `<div class="selbar" role="toolbar" aria-label="选择操作"><span class="subtitle" style="margin-right:12px">已选择 3 项</span>
    <button class="btn subtle">${icon('select', 14)}全选</button><button class="btn">${icon('scan', 14)}识别所选</button><button class="btn">${icon('edit', 14)}批量编辑</button>
    <div style="flex:1"></div><span class="caption" style="margin-right:8px">单击切换选择 · Shift 连选 · Esc 退出</span><button class="btn">${icon('close', 12)}完成</button></div>`;
  const narrow = W < 900;
  return `<div class="head"><span class="title">书架</span><span class="caption count">${o.filtered ? '12 / 384 部作品' : o.flow ? '352 / 384 部作品' : '384 部作品'}</span><div style="flex:1"></div>
   <button class="btn subtle">${icon('sort', 14)}${narrow ? '' : '最近添加'}${icon('down', 10)}</button>
   <button class="btn subtle">${icon('filter', 14)}${narrow ? '' : '筛选'}${o.filtered ? ' <span style="color:var(--accentText);font-weight:600">2</span>' : ''}</button>
   <span style="display:inline-flex;gap:2px"><button class="btn icon subtle ${view === 'grid' ? 'on' : ''}" aria-label="网格视图">${icon('grid', 14)}</button><button class="btn icon subtle ${view === 'list' ? 'on' : ''}" aria-label="列表视图">${icon('list', 14)}</button></span>
   ${narrow ? `<button class="btn icon subtle">${icon('more', 14)}</button>` : `<button class="btn subtle">${icon('select', 14)}选择</button><button class="btn">${icon('plus', 14)}导入</button>`}</div>
   ${o.flow ? `<div class="chips"><span class="fchip">范围：本地游戏 <span class="btn icon subtle" style="width:24px;height:24px">${icon('close', 10)}</span></span><span class="caption">排序：最近游玩 · 已向下滚动</span></div>` : ''}
   ${o.filtered ? `<div class="chips"><span class="fchip">状态：在玩 <span class="btn icon subtle" style="width:24px;height:24px">${icon('close', 10)}</span></span><span class="fchip">只看收藏 <span class="btn icon subtle" style="width:24px;height:24px">${icon('close', 10)}</span></span><button class="btn subtle link" style="height:28px">清除全部</button></div>` : ''}`;
}
function library(o = {}) {
  const avail = W - (MIN ? 0 : EXP ? 240 : 48) - 56, n = cols(avail, MIN ? 128 : 156);
  const sel = new Set(o.selecting ? [0, 3, 4] : []), start = o.scrolled ? n : 0;
  const tiles = GAMES.slice(start).concat(GAMES).slice(0, n * 3).map((g, k) => { const i = (start + k) % GAMES.length; return tile(g, i, { hover: o.hover === i, focus: o.focus === i, pointer: o.pointer === i, selecting: o.selecting, sel: sel.has(i) }); }).join('');
  const menu = o.menu ? `<div class="menu" style="left:${o.menu[0]}px;top:${o.menu[1]}px"><div class="hl">${icon('chevron', 14)}打开详情</div><div>${icon('play', 14)}启动游戏</div><div>${icon('select', 14)}选择</div></div>` : '';
  return shell('library', libHead('grid', o) + `<div class="grid" style="grid-template-columns:repeat(${n},1fr)">${tiles}</div>${menu}`, { query: o.query });
}
function list(o = {}) {
  const avail = W - (MIN ? 0 : EXP ? 240 : 48) - 56;
  const c = [['', '30px'], ['名称', 'minmax(0,1fr)'], ['状态', '92px'], ['评分', '56px'], ['游玩时长', '88px'], ['最近游玩', '96px'], ['安装', '60px']]
    .filter(([k]) => !(avail < 760 && (k === '最近游玩' || k === '安装')) && !(avail < 560 && (k === '评分' || k === '游玩时长')));
  if (o.selecting) c.unshift(['☐', '24px']);
  const tpl = c.map(x => x[1]).join(' '), sel = new Set([0, 3, 4]);
  const rows = GAMES.slice(0, 11).map((g, i) => `<div class="lrow ${o.hover === i ? 'hover' : ''}" style="grid-template-columns:${tpl}">${c.map(([k]) => ({
    '☐': `<span class="cb" style="width:20px;height:20px;border-radius:4px;display:grid;place-items:center;${sel.has(i) ? 'background:var(--accent);color:var(--onAccent)' : 'border:1px solid var(--ctlBottom)'}">${sel.has(i) ? icon('check', 12) : ''}</span>`,
    '': `<div class="thumb">${coverSVG(i)}</div>`,
    '名称': `<div style="min-width:0"><div class="ellipsis ${isJa(g.t) ? 'ja' : ''}" style="font-weight:600">${esc(g.t)}</div><div class="caption ellipsis">${esc(g.o || g.dev)}${g.fav ? ' · ♥ 收藏' : ''}</div></div>`,
    '状态': status2(g.s), '评分': g.r == null ? '<span class="caption">—</span>' : g.r,
    '游玩时长': `<span class="mono" style="font-size:12px">${g.h ? Math.floor(g.h) + ':' + String(Math.round((g.h % 1) * 60)).padStart(2, '0') : '—'}</span>`,
    '最近游玩': `<span class="caption">${g.last}</span>`, '安装': g.inst ? g.inst : '<span class="caption">愿望单</span>' })[k]).join('')}</div>`).join('');
  const head = `<div class="lhead" style="grid-template-columns:${tpl}">${c.map(([k]) => `<span style="${k === '最近游玩' ? 'color:var(--text);font-weight:600' : ''}">${k === '☐' ? '' : k}${k === '最近游玩' ? ' ↓' : ''}</span>`).join('')}</div>`;
  return shell('library', libHead('list', o) + `<div style="padding:0 24px 24px 20px;overflow:hidden;flex:1">${head}${rows}</div>`);
}
function hero(w, h, o = {}) {
  const narrow = w < 720, g = GAMES[GI];
  const plateCls = o.material === 'continuous' || narrow ? 'cont-deep' : 'clear-deep';
  const px = narrow ? 16 : 236, py = narrow ? 196 : 40, pw = narrow ? w - 32 : Math.min(660, w - 268), ph = narrow ? 200 : 220;
  const inner = `<div class="ja clamp2" style="font-family:'Segoe UI Variable Display','Yu Gothic UI';font-size:28px;line-height:36px;font-weight:600">${g.t}</div>
   <div class="caption" style="margin-top:2px">${g.o} · 目录作品 9000 · ${g.dev}</div>
   <div style="display:flex;gap:14px;margin-top:10px;font-size:13px;align-items:center;flex-wrap:wrap">${status2(g.s)}<span>${rating(g.r)}</span>${g.fav ? `<span>${icon('heart', 12)}</span>` : ''}<span class="caption">累计 ${fmtH(g.h)}</span></div>
   <div style="display:flex;gap:8px;margin-top:16px;align-items:center"><button class="btn accent lg">${icon('play', 12)}启动游戏</button>
    <button class="btn lg" style="background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.18);color:#fff">${icon('folder', 14)}<span class="ellipsis" style="max-width:${narrow ? 110 : 190}px">首选 · Hoshiumi-v1.2</span>${icon('down', 10)}</button>
    <button class="btn icon lg" style="width:36px;background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.18);color:#fff" aria-label="更多操作">${icon('more', 14)}</button></div>`;
  return `<div class="hero" style="height:${h}px"><div class="amb">${coverSVG(GI)}</div><div class="fade"></div>
   <div class="poster" style="left:${narrow ? 16 : 32}px;top:${narrow ? 16 : 28}px;width:${narrow ? 120 : 180}px;height:${narrow ? 160 : 240}px">${coverSVG(GI)}</div>
   <div class="glass ${plateCls} onmedia" style="left:${px}px;top:${py}px;width:${pw}px;height:${ph}px"><div class="in">${inner}</div></div></div>`;
}
function details(o = {}) {
  const cw = W - (MIN ? 0 : EXP ? 240 : 48), narrow = cw < 720, dirty = P.dirty !== '0';
  const left = `<section class="card" style="flex:1;min-width:0"><div style="display:flex;align-items:baseline"><span class="subtitle" style="font-size:18px">个人记录</span><span class="caption" style="margin-left:auto">${dirty ? '有未保存的修改' : '已保存'}</span></div>
   <div style="display:grid;grid-template-columns:${narrow ? '1fr' : '1fr 1fr 110px'};gap:14px 16px;margin-top:14px">
    <div class="field" style="grid-column:1/-1"><label>个人名称</label><div class="input ${isJa(GAMES[GI].t) ? 'ja' : ''}">${esc(GAMES[GI].t)}</div></div>
    <div class="field"><label>游玩状态</label><div class="input dirty" style="justify-content:space-between">在玩 ${icon('down', 10)}</div></div>
    <div class="field"><label>个人评分（0–10，可留空）</label><div class="input dirty">9</div></div>
    <div class="field"><label>收藏</label><div style="display:flex;align-items:center;gap:10px;height:32px"><span class="tog"></span>开</div></div>
    <div class="field" style="grid-column:1/-1"><label>笔记</label><div class="input" style="height:64px;align-items:flex-start;padding-top:6px">第二章的天文台场景值得重玩一次，记得先存档到 07 号位。</div></div></div></section>`;
  const right = `<div style="width:${narrow ? 'auto' : '300px'};flex:none;display:flex;flex-direction:column;gap:12px">
   <section class="card"><div style="font-weight:600">游玩记录</div><div style="display:flex;align-items:baseline;gap:6px;margin-top:6px"><span class="mono" style="font-size:24px;line-height:32px">42:30</span><span class="caption">小时</span></div><div class="caption">37 次 · 最近 今天 21:40</div></section>
   <section class="card"><div style="display:flex"><span style="font-weight:600">本地安装</span><span class="caption" style="margin-left:auto">2 个</span></div>
    <div style="margin-top:8px;display:flex;flex-direction:column;gap:6px;font-size:13px"><div style="display:flex;gap:8px;align-items:center">${status2('completed').replace('已完成', '')}<span class="ellipsis" style="flex:1">Hoshiumi-v1.2</span><span class="caption">首选</span></div>
    <div style="display:flex;gap:8px;align-items:center"><span class="dot" style="background:var(--caution)"></span><span class="ellipsis" style="flex:1">Hoshiumi-trial</span><span class="caption">待确认位置</span></div></div>
    <a class="link" style="display:block;margin-top:8px;font-size:14px">管理本地安装</a></section></div>`;
  const heroH = narrow ? 412 : 300;
  return shell('library', `<div class="crumbs"><span class="a">书架</span>${icon('chevron', 10)}<span class="${isJa(GAMES[GI].t) ? 'ja' : ''}">${esc(GAMES[GI].t)}</span></div>
   <div style="margin-top:8px">${hero(cw, heroH, o)}</div>
   <div style="display:flex;${narrow ? 'flex-direction:column;align-items:stretch;padding:16px 16px 80px;' : 'align-items:flex-start;padding:16px 32px 80px;'}gap:12px">${left}${right}</div>
   ${dirty ? `<div class="savebar"><span class="dot" style="background:var(--caution)"></span><span style="flex:1">有 2 项未保存的修改</span><button class="btn">取消修改</button><button class="btn accent">保存修改</button></div>` : ''}`, { back: true });
}
function frame(src, label, w = 1280, h = 800, s = .4) {
  return `<figure style="width:${w * s}px;flex:none"><div style="width:${w * s}px;height:${h * s}px;overflow:hidden;border-radius:8px;border:1px solid var(--stroke);box-shadow:var(--shadow)"><iframe src="${src}" style="width:${w}px;height:${h}px;border:0;transform:scale(${s});transform-origin:0 0"></iframe></div><figcaption class="caption" style="margin-top:8px;font-size:13px;color:var(--text)">${label}</figcaption></figure>`;
}
function flow() {
  const q = `theme=${TH}&accent=${AC}`, arrow = t => `<div style="width:120px;flex:none;text-align:center;align-self:center" class="caption">${t}<div style="font-size:28px;color:var(--text)">→</div></div>`;

function accentBoard() {

   <div class="caption" style="color:var(--text2)">${ACCENTS[ac].name} · ${theme === 'light' ? '浅色' : '深色'}</div>

}
function settingsView() {
  const radio = (n, d, on) => `<div role="radio" aria-checked="${on}" style="display:flex;gap:12px;padding:8px 4px"><span style="width:20px;height:20px;border-radius:10px;flex:none;margin-top:1px;${on ? 'border:5px solid var(--accent)' : 'border:1px solid var(--text2)'}"></span><div><div>${n}</div><div class="caption">${d}</div></div></div>`;

     <div class="caption" style="display:flex;gap:6px;align-items:center;margin-top:4px">${icon('info', 14)}当前生效：完全清透 · 系统允许透明效果，未开启节电</div></div>
    <div style="position:relative;height:250px;border-radius:8px;overflow:hidden">${hero(420, 250).replace('left:236px', 'left:24px').replace('top:40px', 'top:96px').replace(/width:\d+px;height:220px/, 'width:372px;height:140px')}</div>
   </section>
   <div style="font-weight:600;margin:20px 0 8px">在线目录 · NextMoe</div><section class="card" style="padding:0">${row('globe', 'API 密钥', '已保存于当前资料目录 · 仅在本机加密', '<button class="btn">测试连接</button><button class="btn">更换</button><button class="btn subtle">移除</button>', true)}</section>
   <div style="font-weight:600;margin:20px 0 8px">数据</div><section class="card" style="padding:0">${row('folder', '原生资料目录', 'D:\\\\Test\\\\the-order-check\\\\profile-review', '<button class="btn">复制路径</button>', true)}</section></div>`, { session: false });
}
